name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o '*.zip'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > Lumo/app/release.keystore; fi
      - name: Build
        working-directory: Lumo
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Lumo-apk
          path: Lumo/app/build/outputs/apk/release/*.apk
